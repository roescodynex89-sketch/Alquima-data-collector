name: f3-market

on:
  schedule:
    - cron: "7,37 * * * *"      # every 30 min (UTC)
  workflow_dispatch:

concurrency:
  group: f3-market
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m alquima.features.f3_dashboard.macro.run --sink db --part market
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}