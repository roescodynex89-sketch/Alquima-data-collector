name: f3-indicators

on:
  schedule:
    - cron: "20 */3 * * *"      # every 3 hours (UTC)
  workflow_dispatch:

concurrency:
  group: f3-indicators
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m alquima.features.f3_dashboard.macro.run --sink db --part indicators
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}